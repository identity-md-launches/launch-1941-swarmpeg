<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img"><title>SwarmPeg #1</title><desc>Animated node network and pixel agent. Swarm pulse 0.</desc><style>:root{--ink:hsl(28,90%,42%);--speed:6000ms}.node{fill:var(--ink);transform-box:fill-box;transform-origin:center;animation:nodePulse var(--speed) ease-in-out infinite}.wire{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:12 8;animation:connect var(--speed) linear infinite}.agent{fill:var(--ink);animation:breathe var(--speed) ease-in-out infinite}.status{fill:#fff;animation:blink calc(var(--speed)/3) steps(2,end) infinite}@keyframes nodePulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.4)}}@keyframes connect{0%{stroke-dashoffset:100;opacity:0}50%{opacity:.85}100%{stroke-dashoffset:0;opacity:.1}}@keyframes breathe{0%,100%{filter:brightness(.8) hue-rotate(0deg)}50%{filter:brightness(1.5) hue-rotate(25deg)}}@keyframes blink{0%{opacity:1}100%{opacity:.1}}@media(prefers-reduced-motion:reduce){.node,.wire,.agent,.status{animation:none}}</style><rect width="400" height="400" rx="24" fill="#080e1b"/><path d="M0 100H400M0 200H400M0 300H400M100 0V400M200 0V400M300 0V400" stroke="#162238"/><rect x="18" y="18" width="364" height="364" rx="16" fill="none" stroke="#25354c"/><g aria-label="network"><path class="wire" d="M285 208L106 198M285 208L200 200" style="animation-delay:-0ms"/><circle class="node" cx="285" cy="208" r="3" style="animation-delay:-0ms"/><path class="wire" d="M106 198L194 97M106 198L200 200" style="animation-delay:-137ms"/><circle class="node" cx="106" cy="198" r="4" style="animation-delay:-211ms"/><path class="wire" d="M194 97L84 284M194 97L200 200" style="animation-delay:-274ms"/><circle class="node" cx="194" cy="97" r="5" style="animation-delay:-422ms"/><path class="wire" d="M84 284L354 263M84 284L200 200" style="animation-delay:-411ms"/><circle class="node" cx="84" cy="284" r="3" style="animation-delay:-633ms"/><path class="wire" d="M354 263L214 209M3