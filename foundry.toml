[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

[profile.default.fuzz]
runs = 256
seed = "0x5c9e50d4536d3857e26910e56dd149ff53d36cc20afa9ba4cf829b878581f520"

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

# Optional, explicit network rehearsal. The default offline suite never selects a fork.
[profile.rehearsal]
test = "rehearsal"
